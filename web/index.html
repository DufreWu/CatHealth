<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>PawBase · 猫粮成分指南</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<header><a class="brand" href="/">◈ <b>PawBase</b><span>猫的日常，有据可循</span></a><nav><a href="/" data-nav="/">猫粮指南</a><a href="/methodology" data-nav="/methodology">分析方法</a><a href="/review" data-nav="/review">数据复核</a></nav><span class="release">FOOD GUIDE / 0.1</span></header>
<main><div id="status" role="status"></div><section id="guide">
<div class="hero"><div><p class="eyebrow">PAWBASE / NUTRITION EXPLORER</p><h1>读懂标签，<br><span>从了解每一份猫粮开始。</span></h1><p class="intro">看成分、比数据、了解依据。用透明的营养参照，<br>为你和猫的下一次选择，多提供一点信息。</p></div><aside class="principles"><span>我们的原则</span><p>01 <b>提供参照，不做排名</b></p><p>02 <b>数据缺失，明确告知</b></p><p>03 <b>保留来源，方便核对</b></p></aside></div>
<div id="mode-note" class="notice"></div>
<section class="filters" aria-label="商品筛选"><div class="filter-row"><label class="search-label">搜索商品<input id="search" type="search" placeholder="搜索品牌或猫粮名称…"></label><label>品牌<select id="brand"><option value="">全部品牌</option></select></label><label>类型<select id="type"><option value="">全部类型</option><option value="dry">干粮</option><option value="wet">湿粮</option></select></label><label>生命阶段<select id="stage"><option value="">全部阶段</option><option value="kitten">幼猫</option><option value="adult">成猫</option><option value="senior">老年猫</option><option value="all">全阶段</option></select></label></div><div class="filter-bottom"><div><label><input type="checkbox" id="grain">仅看声明无谷</label><label><input type="checkbox" id="prescription">显示处方粮</label></div><button id="reset" class="text-button">重置筛选 ↺</button></div></section>
<div class="lenses"><span>关注镜头</span><label><input type="checkbox" name="lens" value="senior">老年猫</label><label><input type="checkbox" name="lens" value="kidney">肾脏问题</label><label><input type="checkbox" name="lens" value="urinary">泌尿病史</label><label><input type="checkbox" name="lens" value="weight">体重管理</label><small>只调整阅读顺序，不改变数值与分档</small></div>
<div class="results-heading"><h2>探索猫粮 <span id="count"></span></h2><span>按品牌与名称排列 · 无综合评分</span></div><div id="products" class="grid" aria-live="polite"></div><div class="pagination"><button id="prev">上一页</button><span id="page-label"></span><button id="next">下一页</button></div></section>

</main><footer id="footer"></footer>
<div id="compare-tray" hidden><div><b id="selection-count"></b><span>最多 3 个 · 同一口径并排阅读</span></div><button id="compare" class="primary">开始对比 →</button><button id="clear-compare">清空</button></div>
